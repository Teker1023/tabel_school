<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Заборона будь-яких мережевих запитів зі сторінки: дані не можуть бути нікуди відправлені -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="theme-color" content="#2155C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Табель школи</title>
<style id="pinRule"></style>
<style id="pageRule">@page{size:A4 portrait;margin:5mm 4mm}</style>
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --raise:#F6F8FB; --sunk:#E9EDF3; --ink:#141A26; --ink2:#394253; --muted:#687386; --line:#DDE2EA; --line2:#C9D0DB;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E6EDFC; --accent-line:#B9CBF5;
  --ok:#127A50; --ok-soft:#DFF3E9; --warn:#9A5A00; --warn-soft:#FDF1DC; --warn-line:#E9BF74; --bad:#C0392B; --bad-soft:#FCE6E3;
  --side:#10182A; --side-ink:#E7ECF5; --side-muted:#8E9AB0; --side-hover:#1B2540; --side-active:#24315A;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
  --display:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --sheet-ink:#000; --sheet-line:#777; --sheet-bg:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1017; --surface:#151B26; --raise:#1A2130; --sunk:#10151E; --ink:#E6EAF2; --ink2:#C3CAD7; --muted:#8F9AAE; --line:#273042; --line2:#34405A;
    --accent:#7EA4FA; --accent-ink:#0A1224; --accent-soft:#1B2847; --accent-line:#34508F;
    --ok:#5ACB96; --ok-soft:#132E24; --warn:#EDAE4E; --warn-soft:#33260F; --warn-line:#7A5A22; --bad:#FF8173; --bad-soft:#3A1D1A;
    --side:#0A0E15; --side-hover:#141B28; --side-active:#1B2640;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1017; --surface:#151B26; --raise:#1A2130; --sunk:#10151E; --ink:#E6EAF2; --ink2:#C3CAD7; --muted:#8F9AAE; --line:#273042; --line2:#34405A;
  --accent:#7EA4FA; --accent-ink:#0A1224; --accent-soft:#1B2847; --accent-line:#34508F;
  --ok:#5ACB96; --ok-soft:#132E24; --warn:#EDAE4E; --warn-soft:#33260F; --warn-line:#7A5A22; --bad:#FF8173; --bad-soft:#3A1D1A;
  --side:#0A0E15; --side-hover:#141B28; --side-active:#1B2640;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.005em}
p{margin:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.logo svg.i{width:23px;height:23px;stroke:#fff}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.brand-t{min-width:0;display:flex;flex-direction:column;gap:1px}
.brand-t b{font:600 18px/1.15 var(--display);color:#fff}
.brand-t span{font-size:11.5px;line-height:1.3;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-t span:empty{display:none}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-muted);font-weight:600;padding:14px 10px 6px}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-ink);text-align:left;padding:9px 10px;border-radius:10px;position:relative}
.nav:hover{background:var(--side-hover)}
.nav[aria-current="page"]{background:var(--side-active)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#7EA4FA}
.nav-i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--side-muted)}
.nav[aria-current="page"] .nav-i{color:#fff}
.nav-i svg.i{width:18px;height:18px}
.nav-t{display:flex;flex-direction:column;min-width:0}
.nav-t b{font-weight:600;font-size:14.5px}
.nav-t small{font-size:12px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.warn .nav-t small{color:#F2BD66}
.side-toggle{margin-top:auto}
.side-foot{padding:14px 10px 2px;font-size:12.5px;color:var(--side-muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3FBF84;margin-right:7px;vertical-align:1px}
.side-foot .dot.bad{background:#FF6F61}
.side-foot .btn{align-self:flex-start}

.content{min-width:0;padding:24px 28px 48px}
#banner,#view{max-width:1400px;margin:0 auto}
#banner{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
#view{display:flex;flex-direction:column;gap:16px}

/* ---------- заголовок сторінки ---------- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-bottom:4px}
.phead h1{font-size:30px;line-height:1.1}
.lead{color:var(--ink2);max-width:760px;margin-top:6px;font-size:15px}
.pactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- картки, кнопки, поля ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.card > header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > header h2{font-size:20px}
.card > header h3{font-size:17px}
.card > header .sp{flex:1}
.card .sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{min-height:31px;padding:0 11px;font-size:13px;border-radius:8px}
.btn svg.i{width:17px;height:17px}
.btn:disabled{opacity:.45;pointer-events:none}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;padding:0}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.x:disabled{opacity:.3;pointer-events:none}
.x.plain:hover{background:var(--sunk);color:var(--ink)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.field input,.field select,.field textarea{color:var(--ink);font-weight:400;font-size:14.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 160px}
.row > .field.s{flex:0 0 120px}
.row > .field.xs{flex:0 0 78px}
.hint{font-size:13px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill svg.i{width:14px;height:14px}

.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.notice.ok{background:var(--ok-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.notice.bad > svg.i{color:var(--bad)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.choice button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1.5px solid var(--line2);background:var(--surface);border-radius:14px;padding:16px 18px;color:var(--ink)}
.choice button:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice button > b{font:600 17px/1.2 var(--display);display:flex;align-items:center;gap:8px}
.choice button span{font-size:13.5px;color:var(--ink2)}
.notice > svg.i{width:20px;height:20px}
.notice.warn > svg.i{color:var(--warn)}
.notice .grow{flex:1 1 280px}

details.more{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
details.more > summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;display:flex;align-items:center;gap:10px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
details.more[open] > summary::after{transform:rotate(-135deg)}
details.more > summary small{font-weight:400;color:var(--muted)}
details.more > .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}

.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.14)}

/* ---------- таблиці ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;background:var(--surface)}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:middle}
.tbl tbody tr:last-child > *{border-bottom:0}
.tbl thead th{background:var(--raise);font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl input,.tbl select{min-height:34px}
.tbl tbody tr:hover > td{background:var(--raise)}
.tbl tr.warnrow > td{background:var(--warn-soft)}
.tbl tr.dim > td{color:var(--muted)}
.cellname{font-weight:600}
.cellsub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.toolbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.search{display:flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:9px;padding:0 6px 0 10px;background:var(--surface);min-width:240px}
.search input{border:0;background:none;padding:6px 0;min-height:34px}
.search input:focus{outline:none;box-shadow:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search.sq{min-width:0;flex:0 1 230px;padding:0 8px 0 10px;margin-bottom:4px}
.search.sq input{font-size:13.5px;min-height:30px}
.search.sq svg.i{width:15px;height:15px;color:var(--muted);flex:none}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--sunk);color:var(--muted);font:700 11px/1 var(--body);cursor:help;vertical-align:1px;margin-left:5px}
.how{background:var(--raise);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.how b{color:var(--ink)}
.how code{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:600 13px var(--body);white-space:nowrap}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fact{background:var(--raise);border-radius:12px;padding:12px 16px}
.fact b{display:block;font:600 22px/1.15 var(--display);margin-bottom:2px}
.fact span{color:var(--muted);font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px}
.empty > svg.i{width:44px;height:44px;color:var(--muted);stroke-width:1.4}
.empty b{font:600 21px var(--display)}
.empty p{color:var(--muted);max-width:480px}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px 24px;display:flex;flex-direction:row;align-items:center;gap:14px;text-align:left;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop > svg.i{width:32px;height:32px;color:var(--accent);stroke-width:1.5}
.drop b{font:600 17px/1.2 var(--display)}
.drop > div > span{display:block;color:var(--muted);font-size:13px}
body.dragging .drop{border-color:var(--accent);background:var(--accent-soft)}
body.dragging::after{content:"Відпустіть файл, щоб завантажити";position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(36,87,214,.16);font:600 28px var(--display);color:var(--accent);pointer-events:none}
.pat{display:grid;grid-template-columns:repeat(5,52px);gap:4px}
.pat input{text-align:center;padding:4px;min-height:32px}
.pat small{display:block;text-align:center;font-size:11px;color:var(--muted)}
.codepill{display:inline-block;font:700 12.5px/1 "Times New Roman",serif;padding:4px 8px;border-radius:6px;background:var(--sunk);min-width:32px;text-align:center}
.ovr-list{display:flex;flex-wrap:wrap;gap:6px}
.kbd{font:600 12px var(--body);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;background:var(--raise)}

/* ---------- календар ---------- */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cal-m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.cal-m h3{font-size:15px;margin-bottom:8px;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g span{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600}
.cal-g button{border:1px solid transparent;background:var(--raise);border-radius:6px;font-size:12.5px;min-height:28px;padding:0;color:var(--ink);font-variant-numeric:tabular-nums}
.cal-g button:hover{border-color:var(--accent)}
.cal-g button.wk{background:var(--bad-soft);color:var(--bad)}
.cal-g button.off{background:var(--bad);color:#fff;font-weight:700}
.cal-g button.work{background:var(--ok);color:#fff;font-weight:700}
.cal-g button.hol{outline:2px dashed var(--warn);outline-offset:-2px}
.cal-g button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-g i{display:block}

/* ---------- табель (екран) ---------- */
.sheetwrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px;background:#fff;color:#000}
.sheet-page{background:#fff;color:#000;padding:18px 20px 24px;min-width:max-content}
.sheet-head{display:grid;grid-template-columns:2fr 5fr;gap:8px;font:14px/1.3 "Times New Roman",serif;margin-bottom:10px}
.sheet-head .t1{font:700 24px/1.2 "Times New Roman",serif;text-align:center;letter-spacing:.35em}
.sheet-head .t2{font:17px/1.3 "Times New Roman",serif;text-align:center;border-bottom:1px solid #000;padding-bottom:2px}
table.sheet{border-collapse:separate;border-spacing:0;font:14px/1.15 "Times New Roman",serif;color:#000;background:#fff;border-top:1.5px solid #4a5160;border-left:1.5px solid #4a5160}
.sheet th,.sheet td{border-right:1px solid #7f8898;border-bottom:1px solid #7f8898;padding:0 4px;height:26px;text-align:center;vertical-align:middle;white-space:nowrap;font-weight:700}
.sheet thead{position:sticky;top:0;z-index:4}
.sheet thead th{background:#cfd9e8;color:#0b1220;font-weight:700;font-size:13px;line-height:1.15;white-space:normal;height:auto;padding:4px 4px;border-color:#55607a}
.sheet thead th.dn{font-weight:700;font-size:14.5px;min-width:27px;padding:4px 2px;cursor:pointer;user-select:none}
.sheet thead th.dn:hover{background:#b9c8de}
.sheet thead th.dn.we{color:#b00000;background:#f3c4c4}
.sheet thead th.dn.we:hover{background:#eeb0b0}
/* обертаємо лише текст, а не клітинку — інакше її рамки «переїжджають» */
.sheet th.rot{height:150px;width:34px;max-width:34px;padding:6px 1px;vertical-align:middle;overflow:hidden}
.sheet th.rot > span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;font-size:13px;font-weight:700;line-height:1.1;white-space:normal;text-align:center}
.sheet thead th.tcol{border-left:2px solid #2f3747;border-right:2px solid #2f3747;background:#b9c8de}
.sheet td.l{text-align:left}
.sheet td.n{min-width:30px;font-size:13px}
.sheet td.name{min-width:175px;font-size:14.5px;padding-left:7px;cursor:pointer}
.sheet td.post{min-width:120px;font-weight:400;font-size:12.5px;padding-left:6px}
.sheet td.rate{min-width:46px;border-right:2px solid #4a5160}
.sheet td.d{min-width:27px;cursor:pointer;padding:0 2px}
.sheet td.d.z,.sheet td.s.z{color:#6a7385;font-weight:400}
.sheet td.s{min-width:34px;cursor:default;padding:0 2px}
.sheet td.s.sf{border-left:1px solid #4a5160}
.sheet td.s.last{background:#d5deec;font-size:15px;min-width:44px}
.sheet td.t{background:#d5deec;border-left:2px solid #2f3747;border-right:2px solid #2f3747;min-width:38px;cursor:default}
.sheet tr.alt > td{background:#e9eef6}
.sheet tr.alt > td.t,.sheet tr.alt > td.s.last{background:#c9d4e6}
.sheet td.we{background:#fbdada}
.sheet tr.alt > td.we{background:#f6caca}
.sheet td.c-ВП,.sheet td.c-ДД,.sheet tr.alt > td.c-ВП,.sheet tr.alt > td.c-ДД{background:#c6ddf8}
.sheet td.c-ТН,.sheet tr.alt > td.c-ТН{background:#dfc9f4}
.sheet td.c-НА,.sheet tr.alt > td.c-НА{background:#c2ebd0}

function findEmpByRef(txt, list = S.employees) {
  const n = normName(txt); if (!n) return null;
  let e = list.find(x => normName(x.name) === n); if (e) return e;
  const sn = surname(txt), ini = normName(String(txt).trim().split(/\s+/).slice(1).join(''));
  const cand = list.filter(x => { const xs = surname(x.name), stem = Math.min(xs.length, sn.length) - 2; return stem >= 3 && xs.slice(0, stem) === sn.slice(0, stem); });
  return cand.find(x => ini && normName(x.name.split(/\s+/).slice(1).join('')) === ini) || (cand.length === 1 ? cand[0] : null) || list.find(x => surname(x.name) === sn) || null;
}

/* ---------- база даних (IndexedDB) + автоматичні копії ---------- */
const DB_NAME = 'tabel-db', KEEP_SNAPS = 60;
let dbp, saveT, savedAt = 0, saveErr = '';
/* FIRST — у цьому браузері ще немає даних і користувач не вибрав, з чого почати; EPHEMERAL — схоже на приватне вікно */
let FIRST = false, EPHEMERAL = false;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('snaps', { keyPath: 'id', autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode), r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = key => tx('kv', 'readonly', st => st.get(key));
const kvPut = (key, val) => tx('kv', 'readwrite', st => st.put(val, key));
const kvDel = key => tx('kv', 'readwrite', st => st.delete(key));

/* Скасування останньої зміни (кнопка внизу панелі або Ctrl+Z) */
const UNDO = [];
let lastState = null, lastPush = 0;
function save(step) {
  const now = Date.now(), cur = JSON.stringify(S);
  if (lastState && lastState !== cur) {
    if (step || now - lastPush > 2500) { UNDO.push(lastState); if (UNDO.length > 40) UNDO.shift(); }
    lastPush = now;
  }
  lastState = cur;
  S.updated = Date.now();
  clearTimeout(saveT); saveT = setTimeout(flush, 300);
}
async function flush() {
  clearTimeout(saveT);
  if (FIRST) return;
  try { await kvPut('data', S); savedAt = Date.now(); saveErr = ''; }
  catch (e) { saveErr = 'Не вдалося зберегти!'; }
  showSave(); folderSave();
}
const summary = d => `${d.employees.length} прац., ${d.absences.length} відсутн., ${d.subs.length} замін`;
const hasData = () => S.employees.length > 0;
async function snapshot(reason) {
  if (!hasData() || FIRST) return;
  await tx('snaps', 'readwrite', st => st.add({ at: Date.now(), reason, info: summary(S), data: JSON.parse(JSON.stringify(S)) }));
  const all = await listSnaps();
  if (all.length > KEEP_SNAPS) await tx('snaps', 'readwrite', st => all.slice(KEEP_SNAPS).forEach(s => st.delete(s.id)));
}
async function listSnaps() {
  const all = await tx('snaps', 'readonly', st => st.getAll());
  return all.sort((a, b) => b.at - a.at);
}

/* ---------- календар ---------- */
function isWorkingDay(s) {
  const o = S.calendar[s]; if (o) return o.kind === 'work';
  if (S.holidays && holidaysOf(+s.slice(0, 4)).has(s)) return false;
  return dow(s) < 5;
}
const workAs = s => { const o = S.calendar[s]; return o && o.kind === 'work' && o.as != null ? o.as : dow(s); };
function dayTitle(s) {
  const o = S.calendar[s];
  if (o) return o.kind === 'work' ? `робочий день (за розкладом ${WD[o.as ?? dow(s)]})` : 'неробочий день' + (o.title ? ': ' + o.title : '');
  if (S.holidays) { const h = holidaysOf(+s.slice(0, 4)).get(s); if (h) return 'свято: ' + h; }
  return dow(s) < 5 ? 'робочий день' : 'вихідний';
}

  const k = ovrKey(pos, s); if (k in S.overrides) return S.overrides[k];
  if (!empActive(emp, s) || !posActive(pos, s)) return '';
  const a = absAt(emp.id, s); if (a) return a.code;
  const l = loadAt(pos, s); if (!l) return '';   // посада ще не почалась — порожньо, навіть у вихідні
  if (!isWorkingDay(s)) return 'ВХ';
  if (!l.pattern) return '';
  const h = l.pattern[workAs(s)]; return h == null ? '' : h;
}
function cellWhy(emp, pos, s) {
  const k = ovrKey(pos, s), base = [];
  if (!empActive(emp, s)) base.push('працівник не працює в цю дату');
  else if (!posActive(pos, s)) base.push('посада закрита');
  else {
    const a = absAt(emp.id, s);
    if (a) base.push(`відсутність ${a.code} (${CODE_DESC[a.code] || ''}) ${fmtDM(a.from)}–${a.to ? fmtDM(a.to) : '…'}`);
    else if (!loadAt(pos, s)) base.push('посада ще не почалась (графік діє пізніше)');
    else if (!isWorkingDay(s)) base.push(dayTitle(s));
    else { const l = loadAt(pos, s); base.push(l.pattern ? `за графіком ${WD[workAs(s)]}: ${fmt(l.pattern[workAs(s)] ?? 0)} год` : 'графік не заданий'); }
  }
  if (k in S.overrides) base.unshift(`вручну: ${S.overrides[k] === '' ? 'порожньо' : S.overrides[k]}`);
  return base.join('; ');
}
function rowTotals(cells) {
  const t = { days: 0, sum: 0, h1: 0, c: {} };
  cells.forEach((v, i) => { if (typeof v === 'number') { t.days++; t.sum += v; } else if (v) t.c[v] = (t.c[v] || 0) + 1; });
  return t;
}
const addTotals = rows => rows.reduce((a, r) => { a.days += r.tot.days; a.sum += r.tot.sum; a.h1 += r.tot.h1; for (const k in r.tot.c) a.c[k] = (a.c[k] || 0) + r.tot.c[k]; return a; }, { days: 0, sum: 0, h1: 0, c: {} });
const subName = s => s.empId ? (byId(S.employees, s.empId)?.name || '?') : s.subName;
/* модель місяця — одне джерело для екрана, друку й Excel */
function monthRows(y, m) {
  const n = daysIn(y, m), dates = Array.from({ length: n }, (_, i) => iso(y, m, i + 1)), first = dates[0], last = dates[n - 1];
  /* «разом за І пол» у формі школи — робочі дні 1–15 за календарем (0, якщо явок за місяць немає) */
  const wd1 = dates.slice(0, 15).filter(isWorkingDay).length, half = tot => { tot.h1 = tot.days ? wd1 : 0; return tot; };
  const rows = []; let num = 0;
  for (const e of emps()) {
    if ((e.from && e.from > last) || (e.to && e.to < first)) continue;
    /* рядок є, якщо посада відкрита і її графік уже почав діяти (хоч без годин) */
    const ps = e.positions.filter(p => (!p.to || p.to >= first) && loadAt(p, last)); if (!ps.length) continue;
    num++;
    ps.forEach((p, i) => {
      const cells = dates.map(s => cellValue(e, p, s));
      const rate = (loadAt(p, last) || lastLoad(p))?.rate;
      rows.push({ num: i ? '' : num, emp: e, pos: p, first: !i, span: ps.length, sameTitle: ps.every(x => !x.title || x.title === ps[0].title), rate, cells, tot: half(rowTotals(cells)) });
    });
  }
  const ym = first.slice(0, 7);
  const subRows = S.subs.filter(s => s.month === ym || Object.keys(s.days).some(d => d >= first && d <= last)).map(s => {
    const cells = dates.map(d => d in s.days ? s.days[d] : isWorkingDay(d) ? '' : 'ВХ');
    return { sub: s, name: subName(s), label: s.forLabel, cells, tot: half(rowTotals(cells)) };
  });
  return { y, m, dates, rows, subRows, total: addTotals(rows), subTotal: addTotals(subRows) };
}
/* планові години працівника в день за графіком усіх посад */
function plannedHours(emp, s) {
  if (!isWorkingDay(s)) return 0;
  return emp.positions.filter(p => posActive(p, s)).reduce((a, p) => { const l = loadAt(p, s); const v = l && l.pattern ? l.pattern[workAs(s)] : null; return a + (typeof v === 'number' ? v : 0); }, 0);
}
/* години, які треба заміняти: уроки. Адміністративні години директора/заступників (коли є ще рядок уроків) не заміняються */

}
/* робочі дні відсутності в межах навчального року, коли є уроки */
function subDates(a) {
  const emp = byId(S.employees, a.empId); if (!emp) return [];
  const to = a.to || addDays(a.from, 60), out = [];
  for (const s of dateRange(a.from, to)) if (inSchoolYear(s) && lessonHours(emp, s) > 0) out.push({ date: s, planned: lessonHours(emp, s) });

}
const subsOfAbs = a => S.subs.filter(s => s.absId === a.id);
const subHours = s => Object.values(s.days).reduce((x, v) => x + (+v || 0), 0);
/* скільки годин замін уже записано на день по цій відсутності (без рядка except) */
const subHoursOn = (absId, date, except) => S.subs.filter(s => s.absId === absId && s !== except).reduce((a, s) => a + (+s.days[date] || 0), 0);

function absPlanned(a, date) { const e = byId(S.employees, a.empId); return e ? lessonHours(e, date) : 0; }
/* довгі відсутності (ВП, ДД, М) замін не потребують: на це місце береться інша людина */
function needsSubs(a) { return a.code !== 'ВХ' && !LONG_CODES.has(a.code) && subDates(a).length > 0 && !subsOfAbs(a).some(s => subHours(s) > 0); }
/* ---------- читання .xlsx (без інтернету) ---------- */
function unzip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();

  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }

  const n = dv.getUint16(e + 10, true), files = {};

  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));

    files[name] = { method, data: u8.subarray(start, start + size) };
    p += 46 + nl + xl + cl;
  }

    const f = files[name]; if (!f) return null;
    if (f.method === 0) return f.data.slice().buffer;
    if (typeof DecompressionStream === 'undefined') throw new Error('оновіть браузер (Chrome або Edge)');
    return new Response(new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();

const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const tags = (el, t) => [...el.getElementsByTagNameNS('*', t)];

function sheetRows(xml, shared) {
  const doc = xmlDoc(xml), rows = [];
  for (const r of tags(doc, 'row')) {
    const arr = [], rn = +r.getAttribute('r');
    for (const c of tags(r, 'c')) {
      const col = colIdx((c.getAttribute('r') || '').replace(/\d+/g, ''));
      const vEl = tags(c, 'v')[0], t = c.getAttribute('t');
      let v;
      if (t === 's') v = shared[+(vEl?.textContent)] ?? '';
      else if (t === 'inlineStr' || t === 'str') v = tags(c, 't').map(x => x.textContent).join('') || vEl?.textContent || '';
      else { const raw = vEl?.textContent; v = raw == null || raw === '' ? '' : +raw; }
      arr[col >= 0 ? col : arr.length] = typeof v === 'string' ? v.trim() : v;

/* читання табеля школи: всі аркуші-місяці */
async function readTabel(z) {
  const shared = [], ss = await z.text('xl/sharedStrings.xml');
  if (ss) for (const si of tags(xmlDoc(ss), 'si')) shared.push(tags(si, 't').map(t => t.textContent).join(''));
  const wb = xmlDoc(await z.text('xl/workbook.xml')), rels = xmlDoc(await z.text('xl/_rels/workbook.xml.rels'));

    const rid = sh.getAttribute('r:id') || [...sh.attributes].find(a => a.localName === 'id')?.value;
    let target = relMap[rid] || ''; if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\/?xl\//, '').replace(/^\//, '');

    const { rows, merges } = sheetRows(xml, shared);

    const mm = head.match(/за\s+(\S+)\s+(\d{4})\s+року/i); if (!mm) continue;
    const m = MONTHS.indexOf(mm[1].toLowerCase()); if (m < 0) continue;

  }

}
const DAYCOLS = [...Array.from({ length: 15 }, (_, i) => 4 + i), ...Array.from({ length: 16 }, (_, i) => 20 + i)];

function startWizard(a) {

  WIZ = { absId: a.id, rows: dates.map(d => ({
    date: d.date, planned: d.planned,

/* завантаженість кандидата в день: свої години + вже записані заміни (крім цієї відсутності) */
function candLoad(empId, date, exceptAbsId) {
  const e = byId(S.employees, empId); if (!e) return null;
  const abs = absAt(e.id, date), own = abs ? 0 : lessonHours(e, date);
  const subs = S.subs.filter(s => s.empId === e.id && s.absId !== exceptAbsId).reduce((x, s) => x + (+s.days[date] || 0), 0);
  return { own, subs, abs };
}
const sameSubject = (a, b) => { const t = new Set(a.positions.map(p => normName(p.title)).filter(Boolean)); return b.positions.some(p => t.has(normName(p.title))); };
function candOptions(absEmp, date, sel) {
  const all = emps().filter(x => x.id !== absEmp.id && empActive(x, date)), same = all.filter(x => sameSubject(absEmp, x)), rest = all.filter(x => !same.includes(x));
  const opt = x => { const l = candLoad(x.id, date, WIZ.absId); return `<option value="${x.id}"${x.id === sel ? ' selected' : ''}>${esc(x.name)} · ${l.abs ? 'відсутній (' + l.abs.code + ')' : 'свої ' + fmt(l.own) + ' год' + (l.subs ? ' + зам. ' + fmt(l.subs) : '')}</option>`; };
  return '<option value="">— хто заміняє —</option>' + (same.length ? `<optgroup label="Той самий предмет / посада">${same.map(opt).join('')}</optgroup>` : '') +
    `<optgroup label="Інші працівники">${rest.map(opt).join('')}</optgroup><option value="*"${sel === '*' ? ' selected' : ''}>інша особа (текст)…</option>`;

/* кандидати того самого предмета, вільні в цей день — для кнопок швидкого вибору */

function wizSave() {
  const a = byId(S.absences, WIZ.absId), e = byId(S.employees, a.empId);
  for (const r of WIZ.rows) for (const it of r.items) { if (!it.empId || it.empId === '*' || !(+it.h > 0)) continue; const l = candLoad(it.empId, r.date, a.id); if (l?.abs) return toast(`${fmtD(r.date)}: ${byId(S.employees, it.empId).name} сам відсутній (${l.abs.code}) — оберіть іншого`); }
  for (const r of WIZ.rows) { const used = r.items.reduce((x, it) => x + (+it.h || 0), 0); if (used > r.planned + 1e-9) return toast(`${fmtD(r.date)}: замін ${fmt(used)} год, а за графіком у ${e.name} лише ${fmt(r.planned)} — зменште години`); }
  /* людина лишається записаною, навіть якщо години ще не вписані:
     так було після імпорту табеля з Excel, і саме це раніше губилося при збереженні */
  const groups = new Map();
  for (const r of WIZ.rows) for (const it of r.items) {
    const key = it.empId && it.empId !== '*' ? 'e:' + it.empId : 't:' + (it.name || '').trim();

  const old = subsOfAbs(a), keep = [];
  for (const g of groups.values()) {

    if (!s) { s = { id: uid(), absId: a.id, empId: g.empId, subName: g.subName, forEmpId: e.id, forLabel: 'замість ' + genitive(e.name), days: {} }; S.subs.push(s); }

/* ---------- Список працівників (окремий файл школи: стаж, предмети, навантаження) ---------- */
const LIST_HEADS = { name: /прізвищ/i, subj: /предмет/i, stage: /стаж/i };
/* «Іваненко Ганна Петрівна» і «Іваненко Г.П.» — та сама людина: прізвище + перші літери імені та по батькові */
function nameKey(full) {
  const w = String(full || '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  if (!w.length) return '';
  /* «Ганна Іванівна» і «Г.І.» дають однакові ініціали ГІ */
  const ini = w.slice(1).flatMap(part => part.split(/[.\s]+/).filter(Boolean).map(x => x[0])).join('');
  return normName(w[0]) + '|' + normName(ini.slice(0, 2));
}
function matchEmp(full) {
  const k = nameKey(full);
  if (!k) return null;
  const all = S.employees.filter(e => nameKey(e.name) === k);
  if (all.length === 1) return all[0];
  /* якщо кілька однофамільців з тими самими ініціалами — беремо того, хто ще працює */
  return all.find(e => !e.to) || all[0] || null;
}
/* «Англійська мова - 11 год», по рядку на кожну посаду з графіка */
function loadText(emp) {
  if (!emp) return '';
  return emp.positions.map(pos => {
    const l = lastLoad(pos), h = patSum(l?.pattern) || l?.rate || 0;
    return `${(pos.title || '').trim()} - ${fmt(h)} год`;
  }).filter(t => t !== ' - 0 год').join('\n');
}
/* Адміністративні й технічні посади — це не педагогічне навантаження */
const ADMIN_TITLE = /директор|заступ|завгосп|бібліотек|секретар|лаборант|прибираль|сторож|кухар|двірник|опалюв|робітник|машиніст/i;
const posHours = p => { const l = lastLoad(p); return patSum(l?.pattern) || l?.rate || 0; };
/* години уроків за табелем: усі посади, крім адміністративних */
function teachHours(emp) {
  if (!emp) return 0;
  const pos = emp.positions.filter(p => !ADMIN_TITLE.test(p.title || ''));
  return (pos.length ? pos : emp.positions).reduce((a, p) => a + posHours(p), 0);
}
function adminHours(emp) {
  return !emp ? 0 : emp.positions.filter(p => ADMIN_TITLE.test(p.title || '')).reduce((a, p) => a + posHours(p), 0);
}
/* Що записати в колонку предметів:
   є назва предмета й рівно одне число — міняємо тільки число (назви з файлу не чіпаємо);
   клітинка порожня — складаємо рядок з посад табеля;
   чисел кілька (два предмети) — не переписуємо нічого, показуємо години табеля для ручної правки. */
function listNewText(row, emp) {
  if (!emp) return null;
  const cur = String(listCell(row, 'subj') ?? '').trim(), h = teachHours(emp);
  if (!h) return null;
  if (!cur) return loadText(emp);
  /* рахуємо лише числа перед «год», щоб «3–Б клас» не здавалося другим предметом */
  const re = /(\d+[.,]?\d*)(\s*год)/gi, hits = cur.match(re) || [];
  if (hits.length === 1) return cur.replace(re, (m, n, tail) => fmt(h) + tail);
  return null;
}
const listCell = (row, key) => S.list && S.list.cols[key] != null ? (row.cells[S.list.cols[key]] ?? '') : '';
function setListCell(row, key, v) { if (S.list && S.list.cols[key] != null) row.cells[S.list.cols[key]] = v; }
/* розбір завантаженого файлу списку */
function parseListSheet(rows, fileName, sheetName) {
  let head = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++) if ((rows[i] || []).some(v => LIST_HEADS.name.test(String(v)))) { head = i; break; }
  if (head < 0) throw new Error('не знайдено рядок із заголовком «Прізвище…»');
  const cols = {};
  (rows[head] || []).forEach((v, c) => { for (const k in LIST_HEADS) if (cols[k] == null && LIST_HEADS[k].test(String(v))) cols[k] = c; });
  if (cols.name == null) throw new Error('не знайдено колонку з прізвищами');
  const width = rows.reduce((m, r) => Math.max(m, (r || []).length), 0) || 1;
  const data = [];
  for (let i = head + 1; i < rows.length; i++) {
    const cells = Array.from({ length: width }, (_, c) => (rows[i] || [])[c] ?? '');
    const nm = String(cells[cols.name] || '').replace(/\s+/g, ' ').trim();
    /* службові рядки (нумерація колонок, порожні) не показуємо, але зберігаємо — щоб файл не «поїхав» */
    const skip = !nm || nm.length < 4 || /^\d+([.,]\d+)?$/.test(nm);
    data.push({ i, cells, skip });
  }
  return {
    file: fileName, sheet: sheetName, head, cols, width,
    headRow: Array.from({ length: width }, (_, c) => (rows[head] || [])[c] ?? ''),
    preRows: rows.slice(0, head + 1).map(r => Array.from({ length: width }, (_, c) => (r || [])[c] ?? '')),
    rows: data, stageYear: null, at: Date.now()
  };
}
async function openListFile(f) {
  const buf = await f.arrayBuffer();
  let sheets;
  if (/\.xlsx?$/i.test(f.name) && new Uint8Array(buf)[0] === 0x50) {          // .xlsx (zip)
    const z = unzip(buf), shared = [], ss = await z.text('xl/sharedStrings.xml');
    if (ss) for (const si of tags(xmlDoc(ss), 'si')) shared.push(tags(si, 't').map(t => t.textContent).join(''));
    sheets = [];
    for (const n of z.names.filter(n => /^xl\/worksheets\/[^/]+\.xml$/i.test(n)).sort())
      sheets.push({ name: n, rows: sheetRows(await z.text(n), shared).map(r => Array.from(r, v => v ?? '')) });
  } else sheets = readXls(buf);
  const sh = sheets.map(x => ({ x, n: x.rows.filter(r => (r || []).some(v => LIST_HEADS.name.test(String(v)))).length }))
    .sort((a, b) => b.n - a.n || b.x.rows.length - a.x.rows.length)[0]?.x;
  if (!sh) throw new Error('у файлі немає аркушів');
  S.list = parseListSheet(sh.rows, f.name, sh.name);
  save(true); go('list');
  toast(`Список завантажено: ${S.list.rows.length} ${plural(S.list.rows.length, 'рядок', 'рядки', 'рядків')}`);
}
/* експорт списку назад у Excel (.xlsx) з тими самими колонками */
function exportList() {
  if (!S.list) return;
  const L = S.list;
  const mk = (arr, h) => ({ h, cells: arr.map((v, c) => ({ c, v: v === '' || v == null ? '' : v })) });
  const rows = [...L.preRows.map(r => mk(r, 30)), ...L.rows.map(r => mk(r.cells, 42))];
  const widths = Array.from({ length: L.width }, (_, c) => c === L.cols.name ? 30 : c === L.cols.subj ? 32 : c === L.cols.stage ? 8 : 16);
  download(buildXlsx([{ name: (L.sheet || 'Список').replace(/[\/?*\[\]:]/g, '-').slice(0, 31), rows, widths, merges: [], zoom: 100, scale: 100 }]),
    L.file.replace(/\.xlsx?$/i, '') + ` (оновлено ${today()}).xlsx`);
  toast('Файл збережено — відкрийте його в Excel');
}

/* зіставлення посади з аркуша з наявною: за назвою; без назви — за порядком; одна посада в обох — за фактом */
function matchPos(emp, p, i, total = 1) {
  const n = normName(p.title);
  if (n) { const byTitle = emp.positions.find(x => normName(x.title) === n); if (byTitle) return byTitle; }
  else if (emp.positions[i]) return emp.positions[i];
  /* одна посада і там, і тут — вважаємо перейменуванням, лише якщо назви схожі (вч.труд.навч → вч.технологій), а не інша робота */
  if (total !== 1 || emp.positions.length !== 1) return null;
  const t0 = normName(emp.positions[0].title);
  return !n || !t0 || t0.slice(0, 3) === n.slice(0, 3) ? emp.positions[0] : null;
}
/* Імпорт одного аркуша-місяця. mode: 'sched' — лише працівники й графіки; 'full' — ще відсутності, заміни, календар і точне відтворення клітинок.
   chrono — місяці йдуть підряд від старих до нових (імпорт усього файлу): тоді закриваємо тих, хто зник із наступного аркуша. */
/* назва закладу й підписи з аркуша — лише якщо в програмі їх ще немає */
function takeHeader(sh) {

  if (sh.sign) {

    if (dir && !S.sign.directorName) { if (dir.post) S.sign.directorTitle = dir.post; S.sign.directorName = dir.name; }

}
function importSheet(sh, mode, chrono, created) {
  const from = iso(sh.y, sh.m, 1), last = iso(sh.y, sh.m, daysIn(sh.y, sh.m)), prevEnd = addDays(from, -1), full = mode === 'full';
  let order = Math.max(0, ...S.employees.map(e => e.order));
  const hasLater = x => x.positions.some(p => p.loads.some(l => l.from > last));
  const laterExists = S.employees.some(hasLater);
  const pairs = [], present = new Set(), seenPos = new Set();
  const gapOk = (a, b) => { if (a >= addDays(b, -1)) return true; for (const d of dateRange(addDays(a, 1), addDays(b, -1))) if (isWorkingDay(d)) return false; return true; };
  for (const e of sh.employees) {
    let k = S.employees.find(x => normName(x.name) === normName(e.name));
    if (!k) { k = { id: uid(), name: e.name, order: ++order, from: null, to: null, positions: [] }; S.employees.push(k); created.add(k.id); }
    present.add(k.id);
    if (k.to && k.to < last && created.has(k.id)) k.to = null;   // знову з'явився в аркуші
    e.positions.forEach((p, i) => {
      const pFrom = p.start ? iso(sh.y, sh.m, p.start + 1) : from;
      let kp = matchPos(k, p, i, e.positions.length);
      if (!kp) { kp = { id: uid(), title: p.title, to: null, loads: [], _new: true }; k.positions.splice(i, 0, kp); }
      if (kp.to && kp.to < last && !hasLaterPos(kp, last)) kp.to = null;
      seenPos.add(kp.id);
      const cur = loadAt(kp, pFrom);
      /* дні тижня, яких у цьому місяці не було видно (відпустка, лікарняний), беремо з чинного графіка */
      const eff = p.patRaw ? p.patRaw.map((v, w) => v ?? cur?.pattern?.[w] ?? p.pattern[w]) : null;
      const upsert = (rate, pattern) => { const ex = kp.loads.find(l => l.from === pFrom); if (ex) { ex.pattern = pattern; ex.rate = rate; } else kp.loads.push({ from: pFrom, rate, pattern }); };
      if (!cur) upsert(p.rate, eff);
      else if (eff && (JSON.stringify(cur.pattern || null) !== JSON.stringify(eff) || (p.rate != null && cur.rate !== p.rate))) upsert(p.rate ?? cur.rate ?? null, eff);
      else if (!eff && p.rate != null && cur.rate == null) cur.rate = p.rate;
      pairs.push([k, kp, p, sh]);
    });
  }
  if (full) {
    /* хто був активний, але зник із цього аркуша — працював до кінця попереднього місяця (лише при імпорті підряд) */
    if (chrono) for (const x of S.employees) {
      const activeNow = (!x.to || x.to >= from) && x.positions.some(p2 => loadAt(p2, prevEnd) && (!p2.to || p2.to >= from));
      if (!present.has(x.id)) { if (activeNow && created.has(x.id) && !hasLater(x)) x.to = prevEnd; continue; }
      for (const p2 of x.positions) if (!seenPos.has(p2.id) && loadAt(p2, prevEnd) && (!p2.to || p2.to >= from) && !hasLaterPos(p2, last)) p2.to = prevEnd;
    }
    for (const e of sh.employees) {
      const k = S.employees.find(x => normName(x.name) === normName(e.name)), runs = e.positions[0].codes;
      /* безстрокова відсутність із минулого, якої на початку цього місяця вже немає — закінчилась у попередньому */
      for (const a of S.absences) if (a.empId === k.id && !a.to && a.from < from && !runs.some(c => c.code === a.code && c.from === from)) a.to = prevEnd;
      for (const c of runs) {
        const openEnd = c.to === last && LONG_CODES.has(c.code) && !laterExists;
        const ex = S.absences.find(a => a.empId === k.id && a.code === c.code && a.from <= c.to && (a.to == null ? a.from <= c.from || true : gapOk(a.to, c.from) && a.to >= addDays(c.from, -6)));
        if (ex) { if (c.from < ex.from) ex.from = c.from; if (ex.to == null) { if (!openEnd) ex.to = c.to; } else if (openEnd) ex.to = null; else if (ex.to < c.to) ex.to = c.to; continue; }
        S.absences.push({ id: uid(), empId: k.id, code: c.code, from: c.from, to: openEnd ? null : c.to, note: 'з табеля.xlsx' });
      }
    }
    /* календар: будній, де в усіх ВХ → неробочий; вихідний, де в більшості числа → робочий */
    const n = daysIn(sh.y, sh.m), rowsAll = sh.employees.flatMap(e => e.positions);
    for (let i = 0; i < n; i++) {
      const s = iso(sh.y, sh.m, i + 1), vals = rowsAll.map(p => p.cells[i]), nums = vals.filter(v => typeof v === 'number').length, vx = vals.filter(v => v === 'ВХ').length;
      if (dow(s) < 5 && vx > rowsAll.length * 0.8 && !nums) S.calendar[s] = { kind: 'off', title: '' };
      if (dow(s) >= 5 && nums > rowsAll.length * 0.5) S.calendar[s] = { kind: 'work', as: dow(s) === 5 ? 4 : 0 };
    }
    for (const s of sh.subs) {
      const who = findEmpByRef(s.name);
      const m = s.label.match(/^замість\s+(.+)$/i), forEmp = m ? findEmpByRef(m[1]) : null;
      const abs = forEmp ? S.absences.find(a => a.empId === forEmp.id && Object.keys(s.days).length && Object.keys(s.days).every(d => d >= a.from && (!a.to || d <= a.to))) : null;
      if (S.subs.some(x => subName(x) === (who ? who.name : s.name) && x.forLabel === s.label && JSON.stringify(x.days) === JSON.stringify(s.days))) continue;
      S.subs.push({ id: uid(), absId: abs?.id || null, empId: who?.id || null, subName: who ? '' : s.name, forEmpId: forEmp?.id || null, forLabel: s.label, days: { ...s.days }, month: from.slice(0, 7) });
    }

  }
  return { pairs, from, last, laterExists };
}
const hasLaterPos = (p, last) => p.loads.some(l => l.from > last);

/* Увесь файл одразу. kind: 'all' — з чистого аркуша (перший запуск); 'history' — лише місяці, старші за наявні дані */
async function importAll(kind) {
  let sheets = [...IMPORT.sheets].sort((a, b) => a.y - b.y || a.m - b.m);
  if (kind === 'history') {
    const minFrom = S.employees.flatMap(e => e.positions.flatMap(p => p.loads.map(l => l.from))).sort()[0] || '9999';
    sheets = sheets.filter(sh => iso(sh.y, sh.m, daysIn(sh.y, sh.m)) < minFrom);
    if (!sheets.length) { toast('У файлі немає місяців, старших за ті, що вже є в програмі'); return; }
    await snapshot('перед імпортом історії');

    const keep = { school: S.school, sign: S.sign, schoolYear: S.schoolYear, print: S.print, holidays: S.holidays };

  if (kind === 'history') for (const e of S.employees) { if (created.has(e.id) && !e.to) e.to = lastEnd; for (const p of e.positions) if (p._new && !e.to && !p.to && !hasLaterPos(p, lastEnd)) p.to = lastEnd; }

}

    } else { a = { id: uid(), empId, code, from, to, note }; S.absences.push(a); }
    ABS_EDIT = null; MODAL = null; POP = null; save(true);
    if (subDates(a).length && !LONG_CODES.has(code) && ((modal && isNew) || (needsSubs(a) && confirm('Відсутність записано. Період припадає на навчальний рік, у працівника є уроки.\n\nВписати заміни зараз?')))) return startWizard(a);
    keepScroll(render); toast('Відсутність збережено');
  },
  absEditModal: el => { const a = byId(S.absences, el.dataset.id); if (!a) return; POP = null; MODAL = { type: 'abs', editId: a.id, empId: a.empId, code: a.code, from: a.from, to: a.to, open: !a.to, note: a.note }; renderModal(); },
  /* працівник вийшов: відсутність закінчується напередодні вибраної дати */
  absEndBefore: el => {
    const a = byId(S.absences, el.dataset.id), d = el.dataset.d; if (!a) return;
    const end = addDays(d, -1);
    if (end < a.from) { if (!confirm(`Відсутність починається ${fmtD(a.from)} — видалити її повністю?`)) return; S.subs = S.subs.filter(s => s.absId !== a.id); S.absences = S.absences.filter(x => x !== a); }
    else { a.to = end; for (const s of subsOfAbs(a)) for (const k of Object.keys(s.days)) if (k > end) delete s.days[k]; }
    POP = null; MODAL = null; save(true); keepScroll(render); toast(end < a.from ? 'Відсутність видалено' : `Відсутність закінчено ${fmtD(end)} — далі години за графіком`);
  },
  cellWizard: el => { const a = byId(S.absences, el.dataset.id); POP = null; if (a) startWizard(a); },
  editAbs: el => { ABS_EDIT = el.dataset.id; WIZ = null; render(); scrollTo(0, 0); },
  absCancel: () => { ABS_EDIT = null; render(); },
  delAbs: el => {
    const a = byId(S.absences, el.dataset.id); if (!a) return;
    const subs = subsOfAbs(a);
    if (!confirm(`Видалити відсутність ${a.code} ${fmtD(a.from)}–${a.to ? fmtD(a.to) : '…'}${subs.length ? ` разом із ${subs.length} ${plural(subs.length, 'рядком', 'рядками', 'рядками')} замін` : ''}?`)) return;
    S.absences = S.absences.filter(x => x !== a); S.subs = S.subs.filter(s => s.absId !== a.id);
    if (WIZ?.absId === a.id) WIZ = null;
    if (MODAL?.type === 'cell' || MODAL?.type === 'abs') { MODAL = null; POP = null; }
    save(true); keepScroll(render); toast('Відсутність видалено — години знову за графіком');
  },
  absWizard: el => { const a = byId(S.absences, el.dataset.id); if (a) startWizard(a); },
  wizAdd: el => { const r = WIZ.rows[+el.dataset.i], used = r.items.reduce((x, it) => x + (+it.h || 0), 0); r.items.push({ empId: '', name: '', h: Math.max(0, r.planned - used) }); keepScroll(render); },
  wizOk: () => { keepScroll(render); toast('Години застосовано'); },
  pickList: () => $('#fileList').click(),
  listFillOne: el => {
    const r = S.list.rows.find(x => x.i === +el.dataset.i), emp = r && matchEmp(listCell(r, 'name'));
    if (!emp) return;
    setListCell(r, 'subj', listNewText(r, emp)); S.list.at = Date.now(); save(true); keepScroll(render);
  },
  listFill: () => {
    let n = 0;
    for (const r of S.list.rows) {
      if (r.skip) continue;
      const emp = matchEmp(listCell(r, 'name')); if (!emp) continue;
      const t = listNewText(r, emp); if (!t || String(listCell(r, 'subj')).trim() === t) continue;
      setListCell(r, 'subj', t); n++;
    }
    S.list.at = Date.now(); save(true); render();
    const manual = S.list.rows.filter(r => { if (r.skip) return false; const e = matchEmp(listCell(r, 'name')); return e && teachHours(e) && listNewText(r, e) === null; }).length;
    toast(n ? `Оновлено рядків: ${n}${manual ? `, ще ${manual} з кількома предметами — впишіть вручну` : ''}` : 'Нових змін нема');
  },
  listStage: () => {
    const y = CUR.m >= +(S.schoolYear?.from || '09-01').slice(0, 2) ? CUR.y : CUR.y - 1;
    if (S.list.stageYear === y) return toast(`Стаж за ${y}/${y + 1} н. р. уже додано`);
    let n = 0;
    for (const r of S.list.rows) {
      if (r.skip) continue;
      const v = String(listCell(r, 'stage') ?? '').trim().replace(',', '.');
      if (!/^\d+([.]\d+)?$/.test(v)) continue;
      setListCell(r, 'stage', Math.round((+v + 1) * 100) / 100); n++;
    }
    S.list.stageYear = y; S.list.at = Date.now(); save(true); render();
    toast(`Додано рік стажу: ${n} ${plural(n, 'працівник', 'працівники', 'працівників')}`);
  },
  exportList,
  listClear: () => { if (!confirm('Прибрати завантажений список? Сам файл на диску лишиться.')) return; S.list = null; save(true); render(); },
  wizDel: el => { WIZ.rows[+el.dataset.i].items.splice(+el.dataset.j, 1); keepScroll(render); },
  wizQuick: el => { const r = WIZ.rows[+el.dataset.i], used = r.items.reduce((x, it) => x + (+it.h || 0), 0); r.items = r.items.filter(it => it.empId || it.name); r.items.push({ empId: el.dataset.id, name: '', h: Math.max(0, r.planned - used) }); keepScroll(render); },
  wizAssignAll: () => {
    const id = $('#wizAll').value; if (!id || id === '*') return toast('Оберіть працівника зі списку');
    WIZ.all = id; let skipped = 0, n = 0;
    for (const r of WIZ.rows) {
      const used = r.items.reduce((x, it) => x + (+it.h || 0), 0), left = r.planned - used; if (left <= 0) continue;
      if (candLoad(id, r.date, WIZ.absId)?.abs) { skipped++; continue; }
      const ex = r.items.find(it => it.empId === id); if (ex) ex.h = (+ex.h || 0) + left; else r.items.push({ empId: id, name: '', h: left }); n++;
    }
    keepScroll(render); toast(n ? `Поставлено на ${n} ${plural(n, 'день', 'дні', 'днів')}` + (skipped ? `; ${skipped} пропущено — сам відсутній` : '') : 'Вільних годин немає');
  },
  wizClear: () => { WIZ.rows.forEach(r => r.items = []); keepScroll(render); },
  sideToggle: () => { const m = document.body.dataset.side === 'mini' ? '' : 'mini'; document.body.dataset.side = m; try { localStorage.setItem(LS + ':side', m); } catch (e) {} applyZoom(); },
  zoomIn: () => setZoom(Math.min(2.5, Math.round((zoomValue() + 0.1) * 10) / 10)),
  zoomOut: () => setZoom(Math.max(0.2, Math.round((zoomValue() - 0.1) * 10) / 10)),
  zoom100: () => setZoom(1),
  zoomSet: el => setZoom(el.dataset.z),
  wizFill: () => { const f = WIZ.rows[0].items; if (!f.length) return toast('Спершу заповніть перший день'); WIZ.rows.forEach((r, i) => { if (i) r.items = f.map(it => ({ ...it, h: r.planned })); }); keepScroll(render); },
  wizSave, wizCancel: () => { WIZ = null; MODAL = null; render(); },
  /* календар */
  calYear: el => { CALY += +el.dataset.v; render(); },
  calToggle: el => {
    const d = el.dataset.d, o = S.calendar[d];
    if (o) delete S.calendar[d];
    else if (isWorkingDay(d)) { const t = prompt(`${fmtD(d)} зробити неробочим днем. Назва (необов’язково):`, ''); if (t == null) return; S.calendar[d] = { kind: 'off', title: t.trim() }; }
    else { const w = prompt(`${fmtD(d)} зробити робочим днем. За розкладом якого дня тижня працюємо? (Пн, Вт, Ср, Чт, Пт)`, 'Пн'); if (w == null) return; const as = Math.max(0, WD.indexOf(w.trim())); S.calendar[d] = { kind: 'work', as: as > 4 ? 0 : as }; }
    save(true); keepScroll(render);
  },
  calDel: el => { delete S.calendar[el.dataset.d]; save(true); keepScroll(render); },
  calClear: el => { if (!confirm(`Прибрати всі винятки ${el.dataset.y} року?`)) return; for (const k of Object.keys(S.calendar)) if (k.startsWith(el.dataset.y + '-')) delete S.calendar[k]; save(true); render(); },
  /* дані */
  pickXlsx: () => $('#fileXlsx').click(),
  importClose: () => { IMPORT = null; render(); },
  impMode: el => { IMPORT.mode = el.dataset.v; render(); },
  importApply: applyImport,
  openJson: () => $('#fileJson').click(),
  backup: async () => {
    download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), `Табель копія ${today()}.json`);
    lastExport = Date.now(); await kvPut('lastExport', lastExport).catch(() => {}); showBanner();
  },
  snooze: async () => { snoozeUntil = Date.now() + DAY; await kvPut('snooze', snoozeUntil).catch(() => {}); showBanner(); },
  pickDir: async () => {
    try {
      const h = await showDirectoryPicker({ id: 'tabel', mode: 'readwrite', startIn: 'documents' });
      DIR = h; dirOk = true; await kvPut('dir', h); await writeFolder(); render(); toast('Копії записуються в папку «' + h.name + '»');
    } catch (e) { if (e.name !== 'AbortError') toast('Не вдалося вибрати папку'); }
  },
  reconnectDir: async () => {
    try { dirOk = await DIR.requestPermission({ mode: 'readwrite' }) === 'granted'; if (dirOk) await writeFolder(); render(); }
    catch (e) { toast('Папка недоступна — виберіть її знову'); }
  },
  forgetDir: async () => { DIR = null; dirOk = false; await kvDel('dir'); render(); },
  copyDiag: async () => {
    const t = `Табель, перевірка ПК\n${$('#diag')?.dataset.text || ''}\nДані: ${summary(S)}`;
    try { await navigator.clipboard.writeText(t); toast('Скопійовано — надішліть цей текст'); } catch (e) { prompt('Скопіюйте цей текст:', t); }
  },
  snapNow: async () => { await snapshot('вручну'); renderSnaps(); toast('Точку відновлення створено'); },
  snapRestore: async el => {
    const s = (await listSnaps()).find(x => x.id === +el.dataset.id);
    if (!s || !confirm(`Відновити дані станом на ${new Date(s.at).toLocaleString('uk-UA')} (${s.info})?\n\nПоточні дані спершу збережуться в копію.`)) return;
    await takeData(s.data, 'копія від ' + new Date(s.at).toLocaleString('uk-UA')); render();
  },
  snapDownload: async el => {
    const s = (await listSnaps()).find(x => x.id === +el.dataset.id);
    if (s) download(new Blob([JSON.stringify(s.data, null, 1)], { type: 'application/json' }), `Табель копія ${new Date(s.at).toISOString().slice(0, 16).replace(/[T:]/g, '-')}.json`);
  },
  reset: async () => {
    if (prompt('Щоб видалити всі дані, напишіть ТАК') !== 'ТАК') return;
    await snapshot('перед очищенням');
    S = blank(); IMPORT = null; WIZ = null; await flush(); go('help');
  }
};
function moveEmp(id, dir) {
  const list = emps(), i = list.findIndex(e => e.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.forEach((e, k) => e.order = k + 1);
  [list[i].order, list[j].order] = [list[j].order, list[i].order];
  save(true); keepScroll(render);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) return go(tab.dataset.tab);
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) return ACT[a.dataset.act](a);
  const td = e.target.closest('td[data-cell], td[data-sub]');
  if (td) return openPop(td);
  if (e.target.id === 'modal' && (MODAL?.type === 'cell' || MODAL?.type === 'emp')) { POP = null; MODAL = null; render(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.matches('input, textarea, select')) { e.preventDefault(); ACT.undo(); }
  if (e.key === 'Escape' && POP) closePop();
  else if (e.key === 'Escape' && MODAL) ACT.modalClose();
  if (e.key === 'Enter' && e.target.id === 'popH') ACT.popSet();
  if (e.key === 'Enter' && e.target.matches('.drop')) ACT.pickXlsx();
  if (e.key === 'Enter' && /^new(Name|Title|Rate)$/.test(e.target.id)) ACT.addEmp();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.selq) { filterSelects(el.dataset.selq, el.value); return; }
  if (el.dataset.q) {
    const k = el.dataset.q;
    Q[k] = el.value;
    clearTimeout(el._t);
    el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $(`[data-q="${k}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200);
    return;
  }
  if (el.dataset.w) {
    const [i, j, f] = el.dataset.w.split('|'), it = WIZ?.rows[+i]?.items[+j]; if (!it) return;
    if (f === 'h') it.h = el.value === '' ? '' : +String(el.value).replace(',', '.');
    else if (f === 'name') it.name = el.value;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset?.w?.endsWith('|h')) { e.preventDefault(); e.target.blur(); keepScroll(render); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.l) {
    const [i, key] = el.dataset.l.split('|'), r = S.list?.rows.find(x => x.i === +i);
    if (r) { setListCell(r, key, key === 'stage' && /^\d+([.,]\d+)?$/.test(el.value.trim()) ? +el.value.replace(',', '.') : el.value); S.list.at = Date.now(); save(true); }
    return;
  }
  if (el.dataset.w) {
    const [i, j, f] = el.dataset.w.split('|'), it = WIZ?.rows[+i]?.items[+j]; if (!it) return;
    if (f === 'empId') { it.empId = el.value; if (el.value !== '*') it.name = ''; }
    keepScroll(render);   // оновити «лишилось» і завантаженість
    return;
  }
  const f = el.dataset.f; if (!f) return;
  const id = el.dataset.id, v = el.value, num = v === '' ? null : Math.max(0, +String(v).replace(',', '.'));
  let redraw = false;
  switch (f) {
    case 'cur.m': setCur(CUR.y, +v); redraw = true; break;
    case 'cur.y': if (+v >= 2000 && +v <= 2100) { setCur(+v, CUR.m); redraw = true; } break;
    case 'print.emptyCols': S.print.emptyCols = el.checked; redraw = true; break;
    case 'set.holidays': S.holidays = el.checked; redraw = true; break;
    case 'set.school': S.school = v.trim(); break;
    case 'sign.deputyTitle': case 'sign.deputyName': case 'sign.directorTitle': case 'sign.directorName': S.sign[f.slice(5)] = v.trim(); break;
    case 'sy.from': case 'sy.to': if (/^\d{2}-\d{2}$/.test(v.trim())) S.schoolYear[f.slice(3)] = v.trim(); else el.value = S.schoolYear[f.slice(3)]; break;
    case 'emp.name': { const x = byId(S.employees, id); if (v.trim()) x.name = v.trim(); else el.value = x.name; break; }
    case 'emp.from': byId(S.employees, id).from = v || null; redraw = true; break;
    case 'emp.to': byId(S.employees, id).to = v || null; redraw = true; break;
    case 'pos.title': findPos(id)[1].title = v.trim(); break;
    case 'pos.rate': { const [, p] = findPos(id); const l = lastLoad(p); if (l) l.rate = num; redraw = true; break; }
    case 'pos.pat': {
      const [, p] = findPos(id); let l = lastLoad(p);
      if (!l) { l = { from: iso(CUR.y, CUR.m, 1), rate: null, pattern: null }; p.loads.push(l); }
      if (!l.pattern) l.pattern = [null, null, null, null, null];
      l.pattern[+el.dataset.wd] = num;
      if (l.pattern.every(x => x == null)) l.pattern = null;
      redraw = true; break;
    }
    case 'sub.forLabel': byId(S.subs, id).forLabel = v.trim(); break;
    case 'abs.ym': ABS_FILTER.ym = v; return render();
    case 'abs.emp': ABS_FILTER.emp = v; return render();
    case 'cal.as': S.calendar[id].as = +v; break;
    case 'cal.title': S.calendar[id].title = v.trim(); break;
    case 'imp.pick': IMPORT.pick = +v; return render();
  }
  save();
  if (redraw) keepScroll(render); else renderNav();
});
$('#fileXlsx').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openXlsxFile(f); });
$('#fileList').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) try { await openListFile(f); } catch (err) { toast('Не вдалося прочитати файл: ' + (err.message || err)); }
});
$('#fileJson').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openJsonFile(f); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const f = e.dataTransfer?.files?.[0]; if (!f) return;
  if (/\.json$/i.test(f.name)) openJsonFile(f);
  else if (/\.xls$/i.test(f.name) || (TAB === 'list' && /\.xlsx$/i.test(f.name))) openListFile(f).catch(err => toast('Не вдалося прочитати файл: ' + (err.message || err)));
  else if (/\.xlsx$/i.test(f.name)) openXlsxFile(f);
  else toast('Потрібен файл .xlsx, .xls або .json');
});
/* Ctrl + коліщатко над табелем — масштаб табеля, а не всієї сторінки */
addEventListener('wheel', e => { if (!e.ctrlKey || !e.target.closest?.('.sheetwrap')) return; e.preventDefault(); setZoom(Math.max(0.2, Math.min(2.5, Math.round((zoomValue() + (e.deltaY < 0 ? 0.1 : -0.1)) * 10) / 10))); }, { passive: false });
addEventListener('resize', () => applyZoom());
try { document.body.dataset.side = localStorage.getItem(LS + ':side') || ''; } catch (e) {}
addEventListener('beforeprint', () => { closePop(); MODAL = null; WIZ = null; if (Q.tabel) Q.tabel = ''; if (TAB !== 'tabel') go('tabel'); else render(); });
/* підсвічення рядка працівника (обидві посади) при наведенні */
let HL = '';
document.addEventListener('mouseover', e => {
  const id = e.target.closest?.('.sheet tbody tr[data-e]')?.dataset.e || '';
  if (id === HL) return; HL = id;
  $$('.sheet tr.hl').forEach(x => x.classList.remove('hl'));
  if (id) $$(`.sheet tr[data-e="${id}"]`).forEach(x => x.classList.add('hl'));
});

/* логотип: перший файл, який знайдеться поруч із програмою; якщо жодного — лишається стандартний значок */
const LOGOS = ['logo.gif', 'logo.png', 'logo.jpg', 'logo.jpeg', 'logo.webp', 'logo.svg'];
$('#logoImg').addEventListener('error', e => {
  const i = LOGOS.indexOf(e.target.getAttribute('src')) + 1;
  if (i && i < LOGOS.length) e.target.src = LOGOS[i]; else e.target.remove();
});
addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
addEventListener('pagehide', () => flush());

(async () => {
  try {
    const d = await kvGet('data');
    if (valid(d)) S = d;
    else { S = blank(); FIRST = true; MODAL = { type: 'first' }; }   // у базу не пишемо, доки користувач не вибере
    const last = (await listSnaps())[0];
    if (!last || Date.now() - last.at > 30 * 60000) await snapshot('при відкритті');
    lastExport = await kvGet('lastExport') || 0;
    snoozeUntil = await kvGet('snooze') || 0;
    DIR = await kvGet('dir') || null;
    if (DIR) dirOk = await DIR.queryPermission({ mode: 'readwrite' }) === 'granted';
    savedAt = S.updated || 0;
    lastState = JSON.stringify(S);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    /* приватне вікно: браузер дає дуже малу квоту сховища */
    try { const est = await navigator.storage?.estimate?.(); EPHEMERAL = !!(est && est.quota && est.quota < 300 * 1048576); } catch (e) {}
  } catch (e) { saveErr = 'База даних недоступна — відкрийте програму в Chrome або Edge'; if (!S.employees.length) { S = blank(); FIRST = true; MODAL = { type: 'first' }; } }
  render();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
